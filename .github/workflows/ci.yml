name: CI

on:
  push:
    branches: [main, develop/**]
  pull_request:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/ticko --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/ examples/ scripts/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/ examples/ scripts/

      - name: Run mypy
        run: uv run mypy src/ticko examples/ tests/ scripts/

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: List package contents
        run: |
          ls -lh dist/
          uv run --no-project python -m tarfile -l dist/*.tar.gz
          uv run --no-project python -m zipfile -l dist/*.whl

      - name: Verify py.typed is bundled in sdist and wheel
        run: uv run --no-project python scripts/check_distribution_typed.py dist

      - name: Verify the installed wheel exposes types (PEP 561)
        run: |
          uv venv /tmp/typecheck
          uv pip install --python /tmp/typecheck/bin/python dist/*.whl mypy
          printf '[mypy]\n' > /tmp/consumer-mypy.ini
          printf 'from ticko import Stopwatch\nreveal_type(Stopwatch())\n' > /tmp/consumer.py
          /tmp/typecheck/bin/mypy --config-file /tmp/consumer-mypy.ini /tmp/consumer.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  examples:
    name: Test Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run all examples
        run: |
          for example in examples/*.py; do
            echo "Running $example..."
            uv run python "$example"
          done
